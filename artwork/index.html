<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MasterHost — иллюстрации вселенных</title><style>body{margin:0;padding:28px;background:#10151b;color:#eef1f6;font:16px system-ui}header{position:sticky;top:0;background:#10151bf5;padding:12px 0;z-index:1}h1{font-size:26px;margin:0 0 12px}select{padding:12px;background:#222d39;color:inherit;border:1px solid #465464;border-radius:8px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:24px}figure{margin:0;background:#1b2430;border-radius:12px;overflow:hidden}img{width:100%;aspect-ratio:3/2;object-fit:contain;background:#080c10}figcaption{padding:16px}small{display:block;color:#a7b3c4;margin-top:8px}a{color:#6dd6a8}#status{color:#a7b3c4}</style><header><h1>Иллюстрации MasterHost</h1><p id="status">Загрузка реестра…</p><select id="universe" aria-label="Вселенная"><option value="">Все вселенные</option></select> <select id="kind" aria-label="Тип объекта"><option value="">Все объекты</option></select></header><main id="gallery"></main><script>
let inventory,signature='';const u=document.querySelector('#universe'),k=document.querySelector('#kind'),gallery=document.querySelector('#gallery');const labels={factions:'Фракции',locations:'Локации',npcs:'Персонажи',adversaries:'Противники',items:'Предметы',events:'События',scenes:'Сцены',archetypes:'Архетипы',progressionPaths:'Пути развития',visualThemes:'Визуальные темы'};
function selectedEntries(){return inventory.entries.filter(e=>e.status==='generated'&&(!u.value||e.universeId===u.value)&&(!k.value||e.kind===k.value))}
function selectionSignature(){return selectedEntries().map(e=>e.universeId+'/'+e.objectId+'/'+e.checksum).join('|')}
function render(){signature=selectionSignature();gallery.replaceChildren();for(const entry of selectedEntries()){const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption'),title=document.createElement('strong'),description=document.createElement('small'),meta=document.createElement('small');a.href=entry.output.replace(/^artwork\//,'');a.target='_blank';img.src=a.href;img.alt=entry.name;img.loading='lazy';a.append(img);title.textContent=entry.name;description.textContent=entry.description;meta.textContent=entry.universeId+' · '+entry.objectId;caption.append(title,description,meta);figure.append(a,caption);gallery.append(figure)}}
async function refresh(){try{const next=await(await fetch('manifest.json?t='+Date.now())).json();const count=next.entries.filter(e=>e.status==='generated').length;document.querySelector('#status').textContent=`Сгенерировано ${count} из ${next.entries.length}. Здесь исходные изображения; проверка и подключение к играм учитываются отдельно.`;if(!inventory){for(const id of [...new Set(next.entries.map(e=>e.universeId))])u.add(new Option(id,id));for(const [id,label]of Object.entries(labels))k.add(new Option(label,id))}inventory=next;const nextSignature=selectionSignature();if(signature!==nextSignature){signature=nextSignature;render()}}catch{document.querySelector('#status').textContent='Не удалось загрузить реестр. Повторная попытка через 10 секунд.'}}
u.onchange=k.onchange=render;refresh();setInterval(refresh,10000);
</script></html>
