questions:
  - id: world.tone
    label: Tone
    type: choice
    default: heroic
    options: [{ value: heroic, label: Heroic }, { value: dark, label: Dark }]
  - id: world.magic
    label: Magic
    type: choice
    default: common
    options: [{ value: low, label: Low }, { value: common, label: Common }, { value: high, label: High }]
  - id: world.danger
    label: Danger
    type: choice
    default: medium
    options: [{ value: low, label: Low }, { value: medium, label: Medium }, { value: high, label: High }]
generators:
  region.count: { type: integer-range, min: 2, max: 3 }
  settlement.count: { type: integer-range, min: 2, max: 4 }
  settlement.population: { type: integer-range, min: 350, max: 1800 }
  settlement.names: { type: values, values: [Ravenford, Stonecross, Greyhaven, Dunmere, Willowmere, Blackwater] }
  economy:
    type: weighted-table
    entries: [{ value: farming, weight: 40 }, { value: mining, weight: 30 }, { value: trade, weight: 20 }, { value: hunting, weight: 10 }]
traits:
  settlement.dangerous:
    id: settlement.dangerous
    when: { eq: [{ descriptor: world.danger }, high] }
    addTags: [dangerous]
    set: { fortified: true }
templates:
  world.default:
    kind: world
    values:
      name: { value: The Shattered Realms }
      tone: { descriptor: world.tone, default: heroic }
      magic: { descriptor: world.magic, default: common }
    components:
      regions: { template: region.frontier, count: { generator: region.count } }
  region.frontier:
    kind: region
    values:
      name: { value: Northern Reach }
      culture: { value: northern }
      danger: { descriptor: world.danger, default: medium }
    components:
      settlements:
        template: settlement.frontier
        count: { generator: settlement.count }
        parameters:
          culture: { parent: culture }
          danger: { descriptor: world.danger, default: medium }
      mageTower:
        template: location.mage-tower
        when: { in: [{ descriptor: world.magic }, [common, high]] }
      goblin: { template: creature.goblin }
  settlement.frontier:
    kind: settlement
    tags: [frontier]
    parameters:
      culture: { required: true }
      danger: { default: medium }
    traits: [settlement.dangerous]
    values:
      name: { generator: settlement.names }
      population: { generator: settlement.population }
      economy: { generator: economy }
      culture: { param: culture }
      danger: { param: danger }
  location.mage-tower:
    kind: location
    tags: [magic, tower]
    values: { name: { value: Tower of the Veil } }
  creature.goblin:
    kind: creature
    tags: [goblin]
    values: { name: { value: Goblin Scout } }

relations:
  - id: settlement.trade-network
    type: tradesWith
    from: { kind: settlement, tags: [frontier] }
    to: { kind: settlement, tags: [frontier] }
    mode: chain
    bidirectional: true

constraints:
  - id: enough-settlements
    type: entity-count
    query: { kind: settlement }
    min: 4
  - id: trade-exists
    type: relation-count
    relation: tradesWith
    min: 2

characterCreation:
  schemaVersion: "2"
  steps:
    - id: identity
      title: Identity
      fields:
        - { id: name, label: Name, type: text, required: true }
    - id: archetype
      title: Archetype
      fields:
        - id: archetype
          label: Archetype
          type: choice
          required: true
          options:
            - { value: warrior, label: Warrior }
            - { value: rogue, label: Rogue }
            - { value: scholar, label: Scholar }
    - id: abilities
      title: Abilities
      fields:
        - { id: perception, label: Perception, type: number, min: -3, max: 5, default: 0 }
        - { id: athletics, label: Athletics, type: number, min: -3, max: 5, default: 0 }
        - { id: arcana, label: Arcana, type: number, min: -3, max: 5, default: 0, when: { field: archetype, equals: scholar } }
    - id: appearance
      title: Appearance
      fields:
        - id: portrait
          label: Portrait
          type: asset
          required: true
          default: illustrated
          options:
            - { value: illustrated, label: Illustrated portrait }
            - { value: silhouette, label: Silhouette token }
  calculated:
    - { id: readiness, operation: sum, fields: [perception, athletics] }
  starting:
    progression: { experience: 0 }
    resources: { health: 20, mana: 10 }
    inventory:
      - { id: sword, quantity: 1, when: { field: archetype, equals: warrior } }
      - { id: lockpicks, quantity: 1, when: { field: archetype, equals: rogue } }
      - { id: spellbook, quantity: 1, when: { field: archetype, equals: scholar } }
    traits:
      - { id: martial-training, when: { field: archetype, equals: warrior } }
      - { id: subtle, when: { field: archetype, equals: rogue } }
      - { id: learned, when: { field: archetype, equals: scholar } }
    assets:
      - { id: portrait, value: assets/ui/default-portrait.svg }
  portability:
    rules:
      - { fromPackId: masterhost.classic-fantasy-test, fromVersions: [0.1.0], fromSchemaVersions: ["1"], mode: normalize, defaults: { portrait: illustrated } }
      - { fromPackId: masterhost.classic-fantasy-test, fromVersions: [0.0.9], mode: normalize, defaults: { portrait: illustrated } }

checks:
  perception: { label: Perception, dice: 1d20, modifierField: perception }
  athletics: { label: Athletics, dice: 1d20, modifierField: athletics }

resources:
  health: { label: Health, min: 0, max: 30, default: 20 }
  mana: { label: Mana, min: 0, max: 20, default: 10 }
actorTemplates:
  goblin: { label: Goblin, resources: { health: 8, mana: 0 }, attributes: { perception: 1, athletics: 2 }, worldEntityKinds: [creature] }
effects:
  poisoned:
    label: Poisoned
    duration: { type: turns, value: 3 }
    modifiers: { perception: -2, athletics: -1 }
  inspired:
    label: Inspired
    duration: { type: turns, value: 2 }
    modifiers: { perception: 2 }
actions:
  take-damage: { label: Take Damage, kind: resource, target: actor, resource: health, operation: subtract, amount: 5 }
  heal: { label: Heal, kind: resource, target: actor, resource: health, operation: add, amount: 5 }
  poison: { label: Poison, kind: effect, target: actor, effectId: poisoned }
  rally:
    label: Rally
    target: multiple-actors
    steps:
      - effect: { target: target, id: inspired }
  sword-strike:
    label: Sword Strike
    target: single-actor
    steps:
      - check: { id: athletics, against: input.difficulty }
      - when: { previousOutcome: success }
        roll: { id: damage, dice: 1d8 }
      - when: { previousOutcome: success }
        resource: { target: target, resource: health, operation: subtract, value: damage.total }
encounter:
  orderingPolicy: fixed
