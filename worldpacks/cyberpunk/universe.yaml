  "gameLoop": [
    {
      "id": "repair",
      "label": "Restore emergency utilities without surrendering privacy",
      "ruleRefs": [
        "check:interface",
        "action:recover"
      ]
    },
    {
      "id": "consent",
      "label": "Protect witnesses and certify original treatment records",
      "ruleRefs": [
        "check:cool",
        "action:inspire"
      ]
    },
    {
      "id": "memory",
      "label": "Navigate branches and honor explicit copying consent",
      "ruleRefs": [
        "check:reflex",
        "action:hinder"
      ]
    },
    {
      "id": "neighborhood",
      "label": "Settle repair ownership, restitution and shelter",
      "ruleRefs": [
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "rainline-mutual",
      "name": "Rainline Mutual",
      "summary": "A flooded district builds its own utility network. Rescue tenants, prove deliberate outages and decide who owns the repair.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "glass-house",
      "name": "Glass House",
      "summary": "A corporate clinic sells stolen identities as insurance. Protect witnesses, trace consent records and choose how to expose the exchange.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "ghost-transit",
      "name": "Ghost Transit",
      "summary": "An abandoned metro carries a missing courier's memories. Follow the signal, protect displaced sleepers and decide who may copy a person.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
