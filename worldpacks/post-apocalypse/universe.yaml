{
  "schemaVersion": "1",
  "id": "post-apocalypse",
  "genres": [
    "survival",
    "adventure",
    "science-fiction"
  ],
  "tones": [
    "harsh",
    "communal",
    "hopeful"
  ],
  "complexity": "intermediate",
  "recommendedPlayers": {
    "min": 2,
    "max": 6
  },
  "gameLoop": [
    {
      "id": "route",
      "label": "Keep vulnerable travelers safe before moving supplies",
      "ruleRefs": [
        "check:grit",
        "action:recover"
      ]
    },
    {
      "id": "repair",
      "label": "Test seed and rebuild shared infrastructure",
      "ruleRefs": [
        "check:scavenge",
        "action:inspire"
      ]
    },
    {
      "id": "share",
      "label": "Negotiate reserves without excluding households",
      "ruleRefs": [
        "check:heart",
        "resource:water"
      ]
    },
    {
      "id": "rebuild",
      "label": "Record ownership, shortages and maintenance duties",
      "ruleRefs": [
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "dustroad-convoy",
      "name": "Dustroad Convoy",
      "summary": "A supply convoy must cross a broken causeway before a dust front. Rescue isolated travelers, bargain for passage and decide whether its reserves belong to buyers or communities.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "seed-vault",
      "name": "Seed Vault",
      "summary": "A sealed greenhouse offers a harvest at the price of an old isolation protocol. Recover clean seed, investigate contamination and decide who may plant beyond its walls.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "last-grid",
      "name": "Last Grid",
      "summary": "A failing power station can warm one settlement through the coming freeze. Repair its controls, expose unequal rationing and decide how the remaining heat is shared.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
