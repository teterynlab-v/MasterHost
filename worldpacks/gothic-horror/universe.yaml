{
  "schemaVersion": "1",
  "id": "gothic-horror",
  "genres": [
    "horror",
    "adventure",
    "mystery"
  ],
  "tones": [
    "intimate",
    "uncanny",
    "tragic"
  ],
  "complexity": "intermediate",
  "recommendedPlayers": {
    "min": 2,
    "max": 6
  },
  "gameLoop": [
    {
      "id": "investigate",
      "label": "Recover a witnessed promise or original contract",
      "ruleRefs": [
        "check:reason",
        "action:inspire"
      ]
    },
    {
      "id": "protect",
      "label": "Keep witnesses, patients and tenants safe from collection",
      "ruleRefs": [
        "check:nerve",
        "action:recover"
      ]
    },
    {
      "id": "release",
      "label": "Confront a binding debt through a witnessed choice",
      "ruleRefs": [
        "check:occult",
        "action:hinder"
      ]
    },
    {
      "id": "remember",
      "label": "Record who owes care, wages and remembrance",
      "ruleRefs": [
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "mourning-county",
      "name": "Mourning County",
      "summary": "A village inherits an estate whose funeral bells ring for living heirs. Investigate a buried promise, protect the named families and choose how to end its obligation.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "velvet-court",
      "name": "Velvet Court",
      "summary": "A respectable court conceals a blood debt behind invitations and charitable care. Preserve witnesses, confront its patrons and decide whether a public confession can break the contract.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "drowned-choir",
      "name": "Drowned Choir",
      "summary": "A cathedral beneath the reservoir sings through the town's wells. Find the missing choir, restore a safe water route and decide who must remember the drowned parish.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
