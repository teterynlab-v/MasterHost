  "gameLoop": [
    {
      "id": "defend",
      "label": "Protect excluded residents without signing away their harvest",
      "ruleRefs": [
        "check:steel",
        "action:recover"
      ]
    },
    {
      "id": "uncover",
      "label": "Expose broken promises and imposed penance",
      "ruleRefs": [
        "check:guile",
        "action:inspire"
      ]
    },
    {
      "id": "witness",
      "label": "Renew bargains under accountable shared witnesses",
      "ruleRefs": [
        "check:will",
        "resource:hope"
      ]
    },
    {
      "id": "release",
      "label": "Record chosen identities, fair defense and voluntary care",
      "ruleRefs": [
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "dying-marches",
      "name": "Dying Marches",
      "summary": "A sunless border holds its harvest behind oath-bound gates. Recover a stolen dawn bell, expose the cost of protection and choose who may claim the last safe fields.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "witch-principalities",
      "name": "Witch Principalities",
      "summary": "Three witch houses divide a valley by inherited curses. Investigate a broken naming pact, rescue its unnamed children and decide whether the houses retain their bargains.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "plague-pilgrimage",
      "name": "Plague Pilgrimage",
      "summary": "A procession seeks a cure carried by a living saint. Separate disease from imposed penance, protect the sick and choose the conditions under which the cure is shared.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
