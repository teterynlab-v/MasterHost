    {
      "id": "cursed-frontier",
      "name": "Cursed Frontier",
      "summary": "A fence across a promised mourning road wakes a flood rider. Recover the shared agreement, evacuate threatened families and restore a passage people can actually use.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "ghost-railway",
      "name": "Ghost Railway",
      "summary": "An extra midnight carriage carries workers erased from the timetable. Repair its brake lantern, find an unpaid builder and bring the lost crew to a present-day platform.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "occult-boomtown",
