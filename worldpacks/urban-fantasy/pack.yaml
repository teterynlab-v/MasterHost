questions:
  - id: world.tone
    label: Campaign tone
    type: choice
    default: heroic
    options:
      - value: heroic
        label: Heroic
      - value: tense
        label: Tense
      - value: tragic
        label: Tragic
  - id: world.threat
    label: Threat level
    type: choice
    default: high
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
  - id: world.environment
    label: Dominant environment
    type: choice
    default: library
    options:
      - value: library
        label: Hidden court library
      - value: tower
        label: Shared night tower
      - value: streets
        label: Enchanted streets
  - id: world.scarcity
    label: Resource pressure
    type: choice
    default: strained
    options:
      - value: plentiful
        label: Plentiful
      - value: strained
        label: Strained
      - value: rare
        label: Rare
  - id: world.pattern
    label: Universe pattern
    type: choice
    default: hidden-courts
    options:
      - value: hidden-courts
        label: Hidden Courts
      - value: monster-districts
        label: Monster Districts
      - value: municipal-magic-conspiracy
        label: Municipal Magic Conspiracy
  - id: world.campaignKit
    label: Campaign Kit
    type: choice
    default: kit.hidden-courts
    options:
      - value: kit.hidden-courts
        label: "Hidden Courts: After-hours without Tribute"
      - value: kit.monster-districts
        label: "Monster Districts: Dawn behind Working Shades"
      - value: kit.municipal-magic-conspiracy
        label: "Municipal Magic: A City that Can Find You"
  - id: world.visualTheme
    label: Visual theme
    type: choice
    default: visualThemes.1
    options:
      - value: visualThemes.1
        label: After-hours Index
      - value: visualThemes.2
        label: Lantern Block
      - value: visualThemes.3
        label: Civic Route Map
generators:
  region.count:
    type: integer-range
    min: 2
    max: 3
  region.names:
    type: values
    values:
      - Hidden Courts
      - Monster Districts
      - Municipal Magic Conspiracy
  settlement.names:
    type: values
    values:
      - Closing-time Library
      - Lantern Block Lobby
      - Nameless Junction
      - Book Return Chute
      - Blackout Stair
      - Permit Archive
      - Margin Reading Room
      - Night Service Roof
  location.names:
    type: values
    values:
      - Closing-time Library
      - Lantern Block Lobby
      - Nameless Junction
      - Book Return Chute
      - Blackout Stair
      - Permit Archive
      - Margin Reading Room
      - Night Service Roof
  creature.names:
    type: values
    values:
      - Margin Bailiff
      - Daylight Sweep Crew
      - Street Eraser
      - Index Moth
      - Shade Saboteur
      - Permit Enforcer
      - Tomorrow Librarian
      - Sunlit Sentinel
  npc.names:
    type: values
    values:
      - Librarian Mara Leaf
      - Tenant Kai Lantern
      - Dispatcher Ren Route
      - Court Reader Tessa Margin
      - Caretaker Ivo Shade
      - Clerk Bea Permit
      - Borrower Neri Tomorrow
      - Inspector Sol Night
  faction.names:
    type: values
    values:
      - After-hours Library
      - Lantern Block Tenants
      - Civic Spell Office
      - Margin Court
      - Night Shift Mutual
      - Streetname Volunteers
      - Index Court
      - Utility Archive Crew
  event.names:
    type: values
    values:
      - Closing Detention
      - Dawn Notice
      - Address Failure
      - Memory Demand
      - Shade Outage
      - Contract Renewal
      - Return Echo
      - Night Proposal
  encounter.names:
    type: values
    values:
      - The Library Will Not Close
      - An Inspection at Sunrise
      - The Street No Map Can Find
      - A Debt in the Margin
      - The Roof behind the Lock
      - The Contract under the Index
      - Borrowed until Tomorrow
      - Neighbors around One Table
  item.names:
    type: values
    values:
      - Treaty Ending
      - Evening Inspection Proposal
      - Offline Address List
      - Borrowing Record
      - Shade Repair Cell
      - Extension Invoice
      - Present-day Return Ticket
      - Roof Access Slip
  economy:
    type: weighted-table
    entries:
      - value: trade
        weight: 35
      - value: craft
        weight: 30
      - value: service
        weight: 20
      - value: smuggling
        weight: 15
  danger:
    type: integer-range
    min: 1
    max: 5
traits:
  region.threatened:
    id: region.threatened
    when:
      eq:
        - descriptor: world.threat
        - high
    addTags:
      - dangerous
    set:
      alert: true
  location.scarce:
    id: location.scarce
    when:
      ne:
        - descriptor: world.scarcity
        - plentiful
    addTags:
      - contested
    set:
      supplies: limited
templates:
  world.root:
    kind: realm
    values:
      name:
        value: The After-hours City
      tone:
        descriptor: world.tone
        default: heroic
      environment:
        descriptor: world.environment
        default: pastoral
      scarcity:
        descriptor: world.scarcity
        default: strained
    components:
      regions:
        template: region.standard
        count:
          generator: region.count
      faction:
        template: faction.major
      encounter:
        template: encounter.signature
      event:
        template: event.opening
  region.standard:
    kind: province
    traits:
      - region.threatened
    values:
      name:
        generator: region.names
      threat:
        descriptor: world.threat
        default: high
      danger:
        generator: danger
    components:
      settlements:
        template: settlement.standard
        count: 2
      locations:
        template: location.standard
        count: 2
      creatures:
        template: creature.standard
        count: 2
      npc:
        template: npc.standard
      item:
        template: item.signature
  settlement.standard:
    kind: settlement
    tags:
      - community
    values:
      name:
        generator: settlement.names
      economy:
        generator: economy
      environment:
        descriptor: world.environment
        default: pastoral
    components: {}
  location.standard:
    kind: location
    tags:
      - adventure-site
    traits:
      - location.scarce
    values:
      name:
        generator: location.names
      feature:
        descriptor: world.environment
        default: pastoral
    components: {}
  creature.standard:
    kind: creature
    tags:
      - threat
    values:
      name:
        generator: creature.names
      danger:
        generator: danger
    components: {}
  npc.standard:
    kind: npc
    tags:
      - contact
    values:
      name:
        generator: npc.names
      agenda:
        generator: economy
    components: {}
  item.signature:
    kind: item
    tags:
      - treasure
    values:
      name:
        generator: item.names
      scarcity:
        descriptor: world.scarcity
        default: strained
    components: {}
  faction.major:
    kind: faction
    tags:
      - major-faction
    values:
      name:
        generator: faction.names
      agenda:
        generator: economy
    components: {}
  encounter.signature:
    kind: encounter
    tags:
      - set-piece
    values:
      name:
        generator: encounter.names
      threat:
        descriptor: world.threat
        default: high
    components: {}
  event.opening:
    kind: event
    tags:
      - campaign-hook
    values:
      name:
        generator: event.names
      tone:
        descriptor: world.tone
        default: heroic
    components: {}
relations:
  - id: settlement-route
    type: connectedTo
    from:
      kind: settlement
    to:
      kind: settlement
    mode: chain
    bidirectional: true
  - id: faction-influence
    type: influencedBy
    from:
      kind: province
    to:
      kind: faction
      tags:
        - major-faction
    mode: each-to-first
constraints:
  - id: regional-depth
    type: entity-count
    query:
      kind: province
    min: 2
  - id: adventure-sites
    type: entity-count
    query:
      kind: location
    min: 4
  - id: routes-exist
    type: relation-count
    relation: connectedTo
    min: 3
dependencies: []
characterCreation:
  schemaVersion: "1"
  steps:
    - id: identity
      title: Identity
      fields:
        - id: name
          label: Name
          type: text
          required: true
          minLength: 2
          maxLength: 60
    - id: calling
      title: Calling
      fields:
        - id: calling
          label: Calling
          type: choice
          required: true
          options:
            - value: guardian
              label: Guardian
            - value: investigator
              label: Investigator
            - value: witch
              label: Witch
        - id: archetype
          label: City role
          type: choice
          required: true
          default: archetypes.1
          options:
            - value: archetypes.1
              label: Treaty Reader
            - value: archetypes.2
              label: Shade Caretaker
            - value: archetypes.3
              label: Route Archivist
            - value: archetypes.4
              label: Memory Advocate
            - value: archetypes.5
              label: Night Inspector
            - value: archetypes.6
              label: Spell Auditor
            - value: archetypes.7
              label: Page Courier
            - value: archetypes.8
              label: Neighbor Organizer
        - id: path
          label: Progression path
          type: choice
          required: true
          default: progressionPaths.1
          options:
            - value: progressionPaths.1
              label: Open Door Witness
            - value: progressionPaths.2
              label: Safe Dawn Keeper
            - value: progressionPaths.3
              label: Public Route Guardian
            - value: progressionPaths.4
              label: Memory Steward
            - value: progressionPaths.5
              label: Night Mediator
            - value: progressionPaths.6
              label: Civic Spell Reformer
    - id: aptitudes
      title: Aptitudes
      fields:
        - id: body
          label: Body
          type: number
          min: -2
          max: 5
          default: 1
        - id: wits
          label: Wits
          type: number
          min: -2
          max: 5
          default: 1
        - id: magic
          label: Magic
          type: number
          min: -2
          max: 5
          default: 1
    - id: signature
      title: Signature
      fields:
        - id: signature
          label: Signature approach
          type: choice
          required: true
          default: bold
          options:
            - value: bold
              label: Bold
            - value: careful
              label: Careful
            - value: compassionate
              label: Compassionate
        - id: portrait
          label: Portrait
          type: asset
          required: true
          default: standard
          options:
            - value: standard
              label: Urban Fantasy portrait
            - value: silhouette
              label: Silhouette
  calculated:
    - id: readiness
      operation: sum
      fields:
        - body
        - wits
        - magic
  starting:
    progression:
      renown: 0
      experience: 0
      progressionPaths.1: 0
      progressionPaths.2: 0
      progressionPaths.3: 0
      progressionPaths.4: 0
      progressionPaths.5: 0
      progressionPaths.6: 0
    resources:
      health: 18
      focus: 10
      spark: 8
    inventory:
      - id: weapon
        quantity: 1
        when:
          field: calling
          equals: guardian
      - id: kit
        quantity: 1
        when:
          field: calling
          equals: investigator
      - id: relic
        quantity: 1
        when:
          field: calling
          equals: witch
      - id: supply
        quantity: 2
    traits:
      - id: trained-guardian
        when:
          field: calling
          equals: guardian
      - id: trained-investigator
        when:
          field: calling
          equals: investigator
      - id: trained-witch
        when:
          field: calling
          equals: witch
      - id: role-archetypes.1
        when:
          field: archetype
          equals: archetypes.1
      - id: role-archetypes.2
        when:
          field: archetype
          equals: archetypes.2
      - id: role-archetypes.3
        when:
          field: archetype
          equals: archetypes.3
      - id: role-archetypes.4
        when:
          field: archetype
          equals: archetypes.4
      - id: role-archetypes.5
        when:
          field: archetype
          equals: archetypes.5
      - id: role-archetypes.6
        when:
          field: archetype
          equals: archetypes.6
      - id: role-archetypes.7
        when:
          field: archetype
          equals: archetypes.7
      - id: role-archetypes.8
        when:
          field: archetype
          equals: archetypes.8
      - id: path-progressionPaths.1
        when:
          field: path
          equals: progressionPaths.1
      - id: path-progressionPaths.2
        when:
          field: path
          equals: progressionPaths.2
      - id: path-progressionPaths.3
        when:
          field: path
          equals: progressionPaths.3
      - id: path-progressionPaths.4
        when:
          field: path
          equals: progressionPaths.4
      - id: path-progressionPaths.5
        when:
          field: path
          equals: progressionPaths.5
      - id: path-progressionPaths.6
        when:
          field: path
          equals: progressionPaths.6
    assets:
      - id: portrait
        value: assets/ui/portrait.svg
  portability:
    rules: []
checks:
  body:
    label: Body
    dice: 1d20
    modifierField: body
    criticalSuccess:
      rollTotalAtLeast: 20
    criticalFailure:
      rollTotalAtMost: 1
  wits:
    label: Wits
    dice: 2d6
    modifierField: wits
    criticalSuccess:
      rollTotalAtLeast: 12
    criticalFailure:
      rollTotalAtMost: 2
  magic:
    label: Magic
    dice: 1d20
    modifierField: magic
    criticalSuccess:
      rollTotalAtLeast: 20
    criticalFailure:
      rollTotalAtMost: 1
resources:
  health:
    label: Health
    min: 0
    max: 24
    default: 18
  focus:
    label: Focus
    min: 0
    max: 16
    default: 10
  spark:
    label: Spark
    min: 0
    max: 18
    default: 8
items:
  weapon:
    label: Ward Baton
    stackLimit: 1
  kit:
    label: Field Notebook
    stackLimit: 1
  relic:
    label: Court Ribbon
    stackLimit: 1
  supply:
    label: Restorative Tea
    stackLimit: 10
  armor:
    label: Shade Coat
    stackLimit: 1
  tool:
    label: Circuit Tools
    stackLimit: 1
  token:
    label: Witness Badge
    stackLimit: 1
progression:
  renown:
    label: Renown
    min: 0
    max: 100
    default: 0
  experience:
    label: Experience
    min: 0
    default: 0
  progressionPaths.1:
    label: Open Door Witness
    min: 0
    default: 0
  progressionPaths.2:
    label: Safe Dawn Keeper
    min: 0
    default: 0
  progressionPaths.3:
    label: Public Route Guardian
    min: 0
    default: 0
  progressionPaths.4:
    label: Memory Steward
    min: 0
    default: 0
  progressionPaths.5:
    label: Night Mediator
    min: 0
    default: 0
  progressionPaths.6:
    label: Civic Spell Reformer
    min: 0
    default: 0
locations:
  worldEntityKinds:
    - settlement
    - location
actorTemplates:
  adversary:
    label: Margin Bailiff
    resources:
      health: 10
      focus: 0
      spark: 0
    attributes:
      body: 2
      wits: 0
      magic: 1
    inventory:
      - itemId: weapon
        quantity: 1
    progression:
      renown: 0
      experience: 0
    worldEntityKinds:
      - creature
  contact:
    label: Elara the Bold
    resources:
      health: 18
      focus: 10
      spark: 8
    attributes:
      body: 0
      wits: 2
      magic: 2
    inventory:
      - itemId: kit
        quantity: 1
    progression:
      renown: 5
      experience: 0
    worldEntityKinds:
      - npc
  elite:
    label: Wyvern
    resources:
      health: 18
      focus: 10
      spark: 8
    attributes:
      body: 3
      wits: 2
      magic: 2
    inventory:
      - itemId: relic
        quantity: 1
    progression:
      renown: 10
      experience: 5
    worldEntityKinds:
      - creature
effects:
  shaken:
    label: Shaken
    duration:
      type: turns
      value: 2
    modifiers:
      body: -2
    blockedActions:
      - inspire
  blessed:
    label: Blessed
    duration:
      type: rounds
      value: 2
    modifiers:
      wits: 2
  guarded:
    label: Guarded
    duration:
      type: turns
      value: 1
    modifiers:
      magic: 2
actions:
  basic-attack:
    label: Use Ward Baton
    target: single-actor
    steps:
      - check:
          id: body
          against: input.difficulty
      - roll:
          id: impact
          dice: 1d6
        when:
          previousOutcome: success
      - resource:
          target: target
          resource: health
          operation: subtract
          value: impact.total
        when:
          previousOutcome: success
  recover:
    label: Recover Health
    kind: resource
    target: self
    resource: health
    operation: add
    amount: 3
  hinder:
    label: Shaken
    kind: effect
    target: actor
    effectId: shaken
  inspire:
    label: Blessed
    target: multiple-actors
    steps:
      - effect:
          target: target
          id: blessed
  guard:
    label: Guarded
    kind: effect
    target: self
    effectId: guarded
  signature-move:
    label: Signature Move
    target: single-actor
    steps:
      - check:
          id: wits
          against: input.difficulty
      - effect:
          target: target
          id: shaken
        when:
          previousOutcome: success
  pressure:
    label: Spend Spark
    kind: resource
    target: self
    resource: spark
    operation: subtract
    amount: 1
encounter:
  orderingPolicy: fixed
