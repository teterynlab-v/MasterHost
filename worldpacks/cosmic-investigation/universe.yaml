{
  "schemaVersion": "1",
  "id": "cosmic-investigation",
  "genres": [
    "horror",
    "investigation"
  ],
  "tones": [
    "uncanny",
    "cerebral",
    "tense"
  ],
  "complexity": "advanced",
  "recommendedPlayers": {
    "min": 2,
    "max": 6
  },
  "gameLoop": [
    {
      "id": "investigate",
      "label": "Compare independent evidence before accepting a pattern",
      "ruleRefs": [
        "check:reason",
        "action:recover"
      ]
    },
    {
      "id": "knowledge",
      "label": "Test signal geometry or recall with measured controls",
      "ruleRefs": [
        "check:insight",
        "action:inspire"
      ]
    },
    {
      "id": "pressure",
      "label": "Track exposure and protect an exit for every witness",
      "ruleRefs": [
        "check:endurance",
        "resource:composure"
      ]
    },
    {
      "id": "contain",
      "label": "Interrupt harm while preserving accountable evidence and uncertainty",
      "ruleRefs": [
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "coastal-university",
      "name": "Coastal University",
      "summary": "An observatory predicts the disappearance of named archive pages. Compare independent tide records, trace a recent transmitter repair and stop harmful alignment without destroying proof.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "polar-expedition",
      "name": "Polar Expedition",
      "summary": "A warm geometric cavity beneath unmelted ice erases measured time. Use control samples and external clocks, count the unlisted crew and find a cold route out.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "decaying-metropolis",
      "name": "Decaying Metropolis",
      "summary": "An emergency switchboard forgets streets at a repeating interval. Compare passenger journeys, isolate the erasing feed and restore routes without forcing one shared memory.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
