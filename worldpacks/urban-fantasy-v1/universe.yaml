  "gameLoop": [
    {
      "id": "ordinary",
      "label": "Start with a missing book unsafe inspection or emergency call",
      "ruleRefs": [
        "check:wits",
        "action:recover"
      ]
    },
    {
      "id": "hidden",
      "label": "Find the court shade or civic spell behind the problem",
      "ruleRefs": [
        "check:magic",
        "action:inspire"
      ]
    },
    {
      "id": "bargain",
      "label": "Test a practical alternate route before accepting tribute",
      "ruleRefs": [
        "check:body",
        "resource:focus"
      ]
    },
    {
      "id": "balance",
      "label": "Record retained memories safe homes and chosen public routes",
      "ruleRefs": [
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "hidden-courts",
      "name": "Hidden Courts",
      "summary": "A missing treaty ending traps readers inside an after-hours library. Navigate rival courts, retrieve a page due tomorrow and reclaim memories demanded as exit tribute.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "monster-districts",
      "name": "Monster Districts",
      "summary": "A daylight inspection threatens a tower shared by ordinary and nocturnal neighbors. Repair its shades and demonstrate safety while protecting residents' private identities.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "municipal-magic-conspiracy",
      "name": "Municipal Magic Conspiracy",
      "summary": "A private spell extension erases streets from emergency maps. Follow its payment trail, rescue a caller on a lost route and restore names chosen by residents.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
