  "gameLoop": [
    {
      "id": "travel",
      "label": "Travel toward a threatened place",
      "ruleRefs": [
        "action:recover",
        "check:wits"
      ]
    },
    {
      "id": "threat",
      "label": "Reveal a danger or divided loyalty",
      "ruleRefs": [
        "action:hinder",
        "check:spirit"
      ]
    },
    {
      "id": "deed",
      "label": "Act, negotiate, or fight for a consequential result",
      "ruleRefs": [
        "action:basic-attack",
        "check:might"
      ]
    },
    {
      "id": "growth",
      "label": "Award treasure, renown, and a changed relationship",
      "ruleRefs": [
        "action:inspire",
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "border-kingdoms",
      "name": "Border Kingdoms",
      "summary": "Hold a disputed frontier together while roads fail, monster clans migrate, and ambitious wardens test every oath.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "war-of-heirs",
      "name": "War of Heirs",
      "summary": "Navigate a broken succession where banners, marriages, grain routes, and battlefield mercy decide who may wear the crown.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "ancient-empire-ruins",
      "name": "Ruins of the Ancient Empire",
      "summary": "Explore sealed imperial works whose lost engines, restless guardians, and buried laws can reshape the living kingdoms.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
