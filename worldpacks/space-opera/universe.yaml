  "gameLoop": [
    {
      "id": "exploration",
      "label": "Navigate a hazardous route and rescue stranded crews",
      "ruleRefs": [
        "check:insight",
        "action:recover"
      ]
    },
    {
      "id": "diplomacy",
      "label": "Resolve conflicting claims with evidence or force",
      "ruleRefs": [
        "check:command",
        "action:basic-attack"
      ]
    },
    {
      "id": "discovery",
      "label": "Separate useful knowledge from a dangerous weapon",
      "ruleRefs": [
        "check:nerve",
        "action:hinder"
      ]
    },
    {
      "id": "sector-change",
      "label": "Award salvage, renown and a public consequence",
      "ruleRefs": [
        "action:inspire",
        "progression:renown"
      ]
    }
  ],
  "patterns": [
    {
      "id": "voidwake-archipelago",
      "name": "Voidwake Archipelago",
      "summary": "Independent stations depend on a failing relay. Rescue stranded crews, bargain for fuel and decide who controls the only safe route.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "sunforge-hegemony",
      "name": "Sunforge Hegemony",
      "summary": "A quarantine exposes the price of imperial stability. Inspect sealed cargo, negotiate conflicting orders and decide whether to reveal a dangerous treaty.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "nightglass-frontier",
      "name": "Nightglass Frontier",
      "summary": "A dead beacon transmits tomorrow's distress call. Explore abandoned gates, question unreliable records and choose what knowledge the frontier should inherit.",
      "capabilityRefs": [
        "core.play"
      ]
    }
  ],
