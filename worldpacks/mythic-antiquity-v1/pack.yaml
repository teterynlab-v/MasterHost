questions:
  - id: world.tone
    label: Campaign tone
    type: choice
    default: heroic
    options:
      - value: heroic
        label: Heroic
      - value: tense
        label: Tense
      - value: tragic
        label: Tragic
  - id: world.threat
    label: Threat level
    type: choice
    default: high
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
  - id: world.environment
    label: Dominant environment
    type: choice
    default: river
    options:
      - value: river
        label: River cities
      - value: islands
        label: Mythic islands
      - value: threshold
        label: Death's border
  - id: world.scarcity
    label: Resource pressure
    type: choice
    default: strained
    options:
      - value: plentiful
        label: Plentiful
      - value: strained
        label: Strained
      - value: rare
        label: Rare
  - id: world.pattern
    label: Universe pattern
    type: choice
    default: warring-poleis
    options:
      - value: warring-poleis
        label: Warring Poleis
      - value: islands-of-odyssey
        label: Islands of the Odyssey
      - value: underworld-frontier
        label: Underworld Frontier
  - id: world.campaignKit
    label: Campaign Kit
    type: choice
    default: kit.warring-poleis
    options:
      - value: kit.warring-poleis
        label: "Warring Poleis: A Prophecy Worth Keeping"
      - value: kit.islands-of-odyssey
        label: "Islands of the Odyssey: Weather without a Master"
      - value: kit.underworld-frontier
        label: "Underworld Frontier: The Road Back to Life"
  - id: world.visualTheme
    label: Visual theme
    type: choice
    default: visualThemes.1
    options:
      - value: visualThemes.1
        label: Bronze Ford
      - value: visualThemes.2
        label: Pearl Homeward
      - value: visualThemes.3
        label: Quiet Threshold
generators:
  region.count:
    type: integer-range
    min: 2
    max: 3
  region.names:
    type: values
    values:
      - Warring Poleis
      - Islands of the Odyssey
      - Underworld Frontier
  settlement.names:
    type: values
    values:
      - Backward Ford
      - Island of Second Echoes
      - Threshold Stair
      - Bronze Oracle Court
      - Storm Jar Anchorage
      - Hall of Unfinished Deeds
      - Laurel Pass
      - Pearl Cavern
  location.names:
    type: values
    values:
      - Backward Ford
      - Island of Second Echoes
      - Threshold Stair
      - Bronze Oracle Court
      - Storm Jar Anchorage
      - Hall of Unfinished Deeds
      - Laurel Pass
      - Pearl Cavern
  creature.names:
    type: values
    values:
      - War Votary
      - Echo Siren
      - Royal Shade
      - Bronze River Bull
      - Storm Chain Sentinel
      - Memory Moth
      - Decree Guard
      - Pearl Maw
  npc.names:
    type: values
    values:
      - Oracle Ione Bronze
      - Navigator Saro Wave
      - Guide Nema Threshold
      - Marshal Theron Reed
      - Diver Lysa Pearl
      - Judge Oren Quiet
      - Envoy Kallia Laurel
      - Cook Mira Hearth
  faction.names:
    type: values
    values:
      - Bronze Assembly
      - Wave Companions
      - Threshold Chorus
      - River Militia
      - Island Hearths
      - Silent Judges
      - Laurel Envoys
      - Pearl Divers
  event.names:
    type: values
    values:
      - River Reversal
      - Missing Voice
      - Unfinished Queue
      - Tablet Scrape
      - Chain Strain
      - Day Offer
      - Truce Arrival
      - Diver's Warning
  encounter.names:
    type: values
    values:
      - Two Armies and One Omen
      - The Island's Missing Voice
      - The Queue at Death's Border
      - Under the Scraped Decree
      - A Storm Kept in Chains
      - What a Life Left Undone
      - Standards in the Laurel Pass
      - Descent to the Pearl Altar
  item.names:
    type: values
    values:
      - Conditional Omen Tablet
      - Lost Sailor's Bowl
      - Unfinished Deed Token
      - Lowered Standard
      - Storm Jar Shackle
      - Borrowed Day Thread
      - Envoy Laurel Seal
      - Pearl Anchor Stone
  economy:
    type: weighted-table
    entries:
      - value: trade
        weight: 35
      - value: craft
        weight: 30
      - value: service
        weight: 20
      - value: smuggling
        weight: 15
  danger:
    type: integer-range
    min: 1
    max: 5
traits:
  region.threatened:
    id: region.threatened
    when:
      eq:
        - descriptor: world.threat
        - high
    addTags:
      - dangerous
    set:
      alert: true
  location.scarce:
    id: location.scarce
    when:
      ne:
        - descriptor: world.scarcity
        - plentiful
    addTags:
      - contested
    set:
      supplies: limited
templates:
  world.root:
    kind: realm
    values:
      name:
        value: The Bronze Horizon
      tone:
        descriptor: world.tone
        default: heroic
      environment:
        descriptor: world.environment
        default: pastoral
      scarcity:
        descriptor: world.scarcity
        default: strained
    components:
      regions:
        template: region.standard
        count:
          generator: region.count
      faction:
        template: faction.major
      encounter:
        template: encounter.signature
      event:
        template: event.opening
  region.standard:
    kind: province
    traits:
      - region.threatened
    values:
      name:
        generator: region.names
      threat:
        descriptor: world.threat
        default: high
      danger:
        generator: danger
    components:
      settlements:
        template: settlement.standard
        count: 2
      locations:
        template: location.standard
        count: 2
      creatures:
        template: creature.standard
        count: 2
      npc:
        template: npc.standard
      item:
        template: item.signature
  settlement.standard:
    kind: settlement
    tags:
      - community
    values:
      name:
        generator: settlement.names
      economy:
        generator: economy
      environment:
        descriptor: world.environment
        default: pastoral
    components: {}
  location.standard:
    kind: location
    tags:
      - adventure-site
    traits:
      - location.scarce
    values:
      name:
        generator: location.names
      feature:
        descriptor: world.environment
        default: pastoral
    components: {}
  creature.standard:
    kind: creature
    tags:
      - threat
    values:
      name:
        generator: creature.names
      danger:
        generator: danger
    components: {}
  npc.standard:
    kind: npc
    tags:
      - contact
    values:
      name:
        generator: npc.names
      agenda:
        generator: economy
    components: {}
  item.signature:
    kind: item
    tags:
      - treasure
    values:
      name:
        generator: item.names
      scarcity:
        descriptor: world.scarcity
        default: strained
    components: {}
  faction.major:
    kind: faction
    tags:
      - major-faction
    values:
      name:
        generator: faction.names
      agenda:
        generator: economy
    components: {}
  encounter.signature:
    kind: encounter
    tags:
      - set-piece
    values:
      name:
        generator: encounter.names
      threat:
        descriptor: world.threat
        default: high
    components: {}
  event.opening:
    kind: event
    tags:
      - campaign-hook
    values:
      name:
        generator: event.names
      tone:
        descriptor: world.tone
        default: heroic
    components: {}
relations:
  - id: settlement-route
    type: connectedTo
    from:
      kind: settlement
    to:
      kind: settlement
    mode: chain
    bidirectional: true
  - id: faction-influence
    type: influencedBy
    from:
      kind: province
    to:
      kind: faction
      tags:
        - major-faction
    mode: each-to-first
constraints:
  - id: regional-depth
    type: entity-count
    query:
      kind: province
    min: 2
  - id: adventure-sites
    type: entity-count
    query:
      kind: location
    min: 4
  - id: routes-exist
    type: relation-count
    relation: connectedTo
    min: 3
dependencies: []
characterCreation:
  schemaVersion: "1"
  steps:
    - id: identity
      title: Identity
      fields:
        - id: name
          label: Name
          type: text
          required: true
          minLength: 2
          maxLength: 60
    - id: calling
      title: Calling
      fields:
        - id: calling
          label: Calling
          type: choice
          required: true
          options:
            - value: warrior
              label: Warrior
            - value: voyager
              label: Voyager
            - value: seer
              label: Seer
        - id: archetype
          label: Heroic role
          type: choice
          required: true
          default: archetypes.1
          options:
            - value: archetypes.1
              label: Omen Reader
            - value: archetypes.2
              label: Wave Navigator
            - value: archetypes.3
              label: Threshold Guide
            - value: archetypes.4
              label: Bronze Defender
            - value: archetypes.5
              label: Pearl Diver
            - value: archetypes.6
              label: Quiet Witness
            - value: archetypes.7
              label: Laurel Envoy
            - value: archetypes.8
              label: Homeward Singer
        - id: path
          label: Progression path
          type: choice
          required: true
          default: progressionPaths.1
          options:
            - value: progressionPaths.1
              label: Ford Guardian
            - value: progressionPaths.2
              label: Free Storm Herald
            - value: progressionPaths.3
              label: Farewell Keeper
            - value: progressionPaths.4
              label: Laurel Peacemaker
            - value: progressionPaths.5
              label: Pearl Wayfinder
            - value: progressionPaths.6
              label: Living Messenger
    - id: aptitudes
      title: Aptitudes
      fields:
        - id: might
          label: Might
          type: number
          min: -2
          max: 5
          default: 1
        - id: wits
          label: Wits
          type: number
          min: -2
          max: 5
          default: 1
        - id: spirit
          label: Spirit
          type: number
          min: -2
          max: 5
          default: 1
    - id: signature
      title: Signature
      fields:
        - id: signature
          label: Signature approach
          type: choice
          required: true
          default: bold
          options:
            - value: bold
              label: Bold
            - value: careful
              label: Careful
            - value: compassionate
              label: Compassionate
        - id: portrait
          label: Portrait
          type: asset
          required: true
          default: standard
          options:
            - value: standard
              label: Mythic Antiquity portrait
            - value: silhouette
              label: Silhouette
  calculated:
    - id: readiness
      operation: sum
      fields:
        - might
        - wits
        - spirit
  starting:
    progression:
      renown: 0
      experience: 0
      progressionPaths.1: 0
      progressionPaths.2: 0
      progressionPaths.3: 0
      progressionPaths.4: 0
      progressionPaths.5: 0
      progressionPaths.6: 0
    resources:
      vitality: 18
      courage: 10
      favor: 8
    inventory:
      - id: weapon
        quantity: 1
        when:
          field: calling
          equals: warrior
      - id: kit
        quantity: 1
        when:
          field: calling
          equals: voyager
      - id: relic
        quantity: 1
        when:
          field: calling
          equals: seer
      - id: supply
        quantity: 2
    traits:
      - id: trained-warrior
        when:
          field: calling
          equals: warrior
      - id: trained-voyager
        when:
          field: calling
          equals: voyager
      - id: trained-seer
        when:
          field: calling
          equals: seer
      - id: role-archetypes.1
        when:
          field: archetype
          equals: archetypes.1
      - id: role-archetypes.2
        when:
          field: archetype
          equals: archetypes.2
      - id: role-archetypes.3
        when:
          field: archetype
          equals: archetypes.3
      - id: role-archetypes.4
        when:
          field: archetype
          equals: archetypes.4
      - id: role-archetypes.5
        when:
          field: archetype
          equals: archetypes.5
      - id: role-archetypes.6
        when:
          field: archetype
          equals: archetypes.6
      - id: role-archetypes.7
        when:
          field: archetype
          equals: archetypes.7
      - id: role-archetypes.8
        when:
          field: archetype
          equals: archetypes.8
      - id: path-progressionPaths.1
        when:
          field: path
          equals: progressionPaths.1
      - id: path-progressionPaths.2
        when:
          field: path
          equals: progressionPaths.2
      - id: path-progressionPaths.3
        when:
          field: path
          equals: progressionPaths.3
      - id: path-progressionPaths.4
        when:
          field: path
          equals: progressionPaths.4
      - id: path-progressionPaths.5
        when:
          field: path
          equals: progressionPaths.5
      - id: path-progressionPaths.6
        when:
          field: path
          equals: progressionPaths.6
    assets:
      - id: portrait
        value: assets/ui/portrait.svg
  portability:
    rules: []
checks:
  might:
    label: Might
    dice: 1d20
    modifierField: might
    criticalSuccess:
      rollTotalAtLeast: 20
    criticalFailure:
      rollTotalAtMost: 1
  wits:
    label: Wits
    dice: 2d6
    modifierField: wits
    criticalSuccess:
      rollTotalAtLeast: 12
    criticalFailure:
      rollTotalAtMost: 2
  spirit:
    label: Spirit
    dice: 1d20
    modifierField: spirit
    criticalSuccess:
      rollTotalAtLeast: 20
    criticalFailure:
      rollTotalAtMost: 1
resources:
  vitality:
    label: Vitality
    min: 0
    max: 24
    default: 18
  courage:
    label: Courage
    min: 0
    max: 16
    default: 10
  favor:
    label: Favor
    min: 0
    max: 18
    default: 8
items:
  weapon:
    label: Bronze Spear
    stackLimit: 1
  kit:
    label: Voyager Satchel
    stackLimit: 1
  relic:
    label: Oracle Thread
    stackLimit: 1
  supply:
    label: Restorative Oil
    stackLimit: 10
  armor:
    label: Bronze Shield
    stackLimit: 1
  tool:
    label: Diving Reed
    stackLimit: 1
  token:
    label: Laurel Seal
    stackLimit: 1
progression:
  renown:
    label: Renown
    min: 0
    max: 100
    default: 0
  experience:
    label: Experience
    min: 0
    default: 0
  progressionPaths.1:
    label: Ford Guardian
    min: 0
    default: 0
  progressionPaths.2:
    label: Free Storm Herald
    min: 0
    default: 0
  progressionPaths.3:
    label: Farewell Keeper
    min: 0
    default: 0
  progressionPaths.4:
    label: Laurel Peacemaker
    min: 0
    default: 0
  progressionPaths.5:
    label: Pearl Wayfinder
    min: 0
    default: 0
  progressionPaths.6:
    label: Living Messenger
    min: 0
    default: 0
locations:
  worldEntityKinds:
    - settlement
    - location
actorTemplates:
  adversary:
    label: River Bull
    resources:
      vitality: 10
      courage: 0
      favor: 0
    attributes:
      might: 2
      wits: 0
      spirit: 1
    inventory:
      - itemId: weapon
        quantity: 1
    progression:
      renown: 0
      experience: 0
    worldEntityKinds:
      - creature
  contact:
    label: Elara the Bold
    resources:
      vitality: 18
      courage: 10
      favor: 8
    attributes:
      might: 0
      wits: 2
      spirit: 2
    inventory:
      - itemId: kit
        quantity: 1
    progression:
      renown: 5
      experience: 0
    worldEntityKinds:
      - npc
  elite:
    label: Wyvern
    resources:
      vitality: 18
      courage: 10
      favor: 8
    attributes:
      might: 3
      wits: 2
      spirit: 2
    inventory:
      - itemId: relic
        quantity: 1
    progression:
      renown: 10
      experience: 5
    worldEntityKinds:
      - creature
effects:
  shaken:
    label: Shaken
    duration:
      type: turns
      value: 2
    modifiers:
      might: -2
    blockedActions:
      - inspire
  blessed:
    label: Blessed
    duration:
      type: rounds
      value: 2
    modifiers:
      wits: 2
  guarded:
    label: Guarded
    duration:
      type: turns
      value: 1
    modifiers:
      spirit: 2
actions:
  basic-attack:
    label: Use Bronze Spear
    target: single-actor
    steps:
      - check:
          id: might
          against: input.difficulty
      - roll:
          id: impact
          dice: 1d6
        when:
          previousOutcome: success
      - resource:
          target: target
          resource: vitality
          operation: subtract
          value: impact.total
        when:
          previousOutcome: success
  recover:
    label: Recover Vitality
    kind: resource
    target: self
    resource: vitality
    operation: add
    amount: 3
  hinder:
    label: Shaken
    kind: effect
    target: actor
    effectId: shaken
  inspire:
    label: Blessed
    target: multiple-actors
    steps:
      - effect:
          target: target
          id: blessed
  guard:
    label: Guarded
    kind: effect
    target: self
    effectId: guarded
  signature-move:
    label: Signature Move
    target: single-actor
    steps:
      - check:
          id: wits
          against: input.difficulty
      - effect:
          target: target
          id: shaken
        when:
          previousOutcome: success
  pressure:
    label: Spend Favor
    kind: resource
    target: self
    resource: favor
    operation: subtract
    amount: 1
encounter:
  orderingPolicy: fixed
