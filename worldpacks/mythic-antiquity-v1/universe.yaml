      "summary": "A homeward crew encounters the voice of a companion it abandoned. Free a captive storm and restore a truthful story before the beacon will lead them home.",
      "capabilityRefs": [
        "core.play"
      ]
    },
    {
      "id": "underworld-frontier",
      "name": "Underworld Frontier",
      "summary": "A living visitor follows an unfinished request across death's border. Face unequal judgment, choose the cost of a farewell and return without commanding the dead.",
